# Atualiza a idade no README (placeholder <span class="profile-age">N</span>).
# Ano de nascimento — ajuste BIRTH_MONTH e BIRTH_DAY para idade exata no aniversário.
name: Update README age

on:
  schedule:
    # Diário às 06:00 UTC (~03h BR); pode alterar o horário
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  age:
    runs-on: ubuntu-latest
    env:
      BIRTH_YEAR: "1999"
      # Opcional: defina mês (1-12) e dia (1-31) para idade correta antes/depois do aniversário
      BIRTH_MONTH: ""
      BIRTH_DAY: ""
    steps:
      - uses: actions/checkout@v4

      - name: Compute age and patch README
        run: |
          set -e
          if [ -n "${BIRTH_MONTH}" ] && [ -n "${BIRTH_DAY}" ]; then
            AGE="$(python3 -c "from datetime import date; import os; y=int(os.environ['BIRTH_YEAR']); m=int(os.environ['BIRTH_MONTH']); d=int(os.environ['BIRTH_DAY']); b=date(y,m,d); t=date.today(); print(t.year-b.year-((t.month,t.day)<(b.month,b.day)))")"
          else
            YEAR_NOW="$(date -u +%Y)"
            AGE=$(( YEAR_NOW - BIRTH_YEAR ))
          fi
          echo "Computed age: ${AGE}"
          perl -i -pe 's/(<span class="profile-age">)\d+(<\/span>)/$1'"$AGE"'$2/' README.md

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No change to README."
          else
            git commit -m "chore: update age in README"
            git push
          fi
